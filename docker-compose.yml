name: sae

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sae}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sae}
      POSTGRES_DB: ${POSTGRES_DB:-sae}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Joué automatiquement au premier démarrage (volume vide)
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sae}:${POSTGRES_PASSWORD:-sae}@db:5432/${POSTGRES_DB:-sae}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    # Dev : code monté en volume + rechargement à chaud
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Interface web pour explorer la base : docker compose --profile tools up
  adminer:
    image: adminer
    profiles: ["tools"]
    depends_on:
      - db
    ports:
      - "${ADMINER_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
